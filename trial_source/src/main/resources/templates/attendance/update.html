<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w300">コース内容</th>
							<th class="w60"></th>
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								
								<!-- 坂井瞬 – Task.28 -->
								<td class="w60">
									<input type="button" th:value="定時" th:onclick="'setRegularTime(' + ${stat.index} + ')'" class="form-control btn btn-success default-button"></input>
								</td>
								
								<!-- 坂井瞬 – Task.26 -->
								<td class="w70">
									<select th:id="'trainingStartTimeHour' + ${stat.index}" th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" class="form-control">
										<option th:each="hourMap : ${attendanceForm.hourMaps}" th:value="${hourMap.key}" th:inlne="text" class="form-control" 
											th:selected="${hourMap.key == dailyAttendanceForm.trainingStartTimeHour}">[[${hourMap.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<select th:id="'trainingStartTimeMinute' + ${stat.index}" th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" class="form-control">
										<option th:each="minuteMap : ${attendanceForm.minuteMaps}" th:value="${minuteMap.key}" th:inlne="text" class="form-control" 
											th:selected="${minuteMap.key == dailyAttendanceForm.trainingStartTimeMinute}">[[${minuteMap.value}]]</option>
									</select>
								</td>
								<td class="w70">
									<select th:id="'trainingEndTimeHour' + ${stat.index}" th:name="|attendanceList[${stat.index}].trainingEndTimeHour|" class="form-control">
										<option th:each="hourMap : ${attendanceForm.hourMaps}" th:value="${hourMap.key}" th:inlne="text" class="form-control" 
											th:selected="${hourMap.key == dailyAttendanceForm.trainingEndTimeHour}">[[${hourMap.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<select th:id="'trainingEndTimeMinute' + ${stat.index}" th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" class="form-control">
										<option th:each="minuteMap : ${attendanceForm.minuteMaps}" th:value="${minuteMap.key}" th:inlne="text" class="form-control" 
											th:selected="${minuteMap.key == dailyAttendanceForm.trainingEndTimeMinute}">[[${minuteMap.value}]]</option>
									</select>
								</td>
								
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" />
				</div>

			</form>
		</div>
	</div>
	
	<!-- 坂井瞬 – Task.28 -->
	<script>
		function setRegularTime(index){
			const startTimeHourInput = document.getElementById('trainingStartTimeHour' + index);
			const startTimeMinuteInput = document.getElementById('trainingStartTimeMinute' + index);
			const endTimeHourInput = document.getElementById('trainingEndTimeHour' + index);
			const endTimeMinuteInput = document.getElementById('trainingEndTimeMinute' + index);
			
			if(startTimeHourInput)startTimeHourInput.value = '9';
			if(startTimeMinuteInput)startTimeMinuteInput.value = '0';
			if(endTimeHourInput)endTimeHourInput.value = '18';
			if(endTimeMinuteInput)endTimeMinuteInput.value = '0';
		}
	</script>

</body>
</html>
